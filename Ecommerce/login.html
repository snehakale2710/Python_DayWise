<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login - ShopNow</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

</head>


<body>

    <nav class="navbar">

        <div class="logo">

            <a href="index.html">
                SHOP<span>NOW</span>
            </a>

        </div>


        <div class="nav-right">

            <a
                href="index.html"
                class="nav-icon"
            >
                <i class="fa-solid fa-house"></i>
            </a>

        </div>

    </nav>


    <section class="login-section">

        <div class="login-box">

            <h2>
                Login
            </h2>

            <p>
                Welcome back!
            </p>


            <form id="loginForm">

                <div class="form-group">

                    <label>
                        Email
                    </label>

                    <input
                        type="email"
                        id="loginEmail"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label>
                        Password
                    </label>

                    <input
                        type="password"
                        id="loginPassword"
                        placeholder="Enter your password"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="login-button"
                >
                    Login
                </button>


                <p class="login-register">

                    Don't have an account?

                    <a href="profile.html">
                        Create Profile
                    </a>

                </p>

            </form>

        </div>

    </section>


    <script>

        const loginForm =
            document.getElementById("loginForm");


        loginForm.addEventListener(
            "submit",
            function(event) {

                event.preventDefault();


                const email =
                    document.getElementById(
                        "loginEmail"
                    ).value;


                const password =
                    document.getElementById(
                        "loginPassword"
                    ).value;


                if (
                    email &&
                    password
                ) {

                    localStorage.setItem(
                        "userEmail",
                        email
                    );


                    alert(
                        "Login successful!"
                    );


                    window.location.href =
                        "index.html";

                }

            }
        );

    </script>

</body>

</html>

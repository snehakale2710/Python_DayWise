<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >
    <title>Profile - ShopNow</title>
    <link
        rel="stylesheet"
        href="style.css"
    >
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >
</head>
<body>
    <nav class="navbar">
        <div class="logo">
            <a href="index.html">
                SHOP<span>NOW</span>
            </a>
        </div>
        <div class="nav-right">
            <a
                href="index.html"
                class="nav-icon"
            >
                <i class="fa-solid fa-house"></i>
            </a>
        </div>
    </nav>
    <section class="profile-section">
        <div class="profile-box">
            <div class="profile-icon">
                <i class="fa-solid fa-user"></i>
            </div>
            <h2>
                Create Your Profile
            </h2>
            <form id="profileForm">
                <div class="form-group">
                    <label>
                        Full Name
                    </label>
                    <input
                        type="text"
                        id="name"
                        placeholder="Enter your name"
                        required
                    >
                </div>
                <div class="form-group">
                    <label>
                        Email
                    </label>
                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required
                    >
                </div>
                <div class="form-group">
                    <label>
                        Phone Number
                    </label>
                    <input
                        type="tel"
                        id="phone"
                        placeholder="Enter your phone number"
                        required
                    >
                </div>
                <div class="form-group">
                    <label>
                        Password
                    </label>
                    <input
                        type="password"
                        id="password"
                        placeholder="Create password"
                        required
                    >
                </div>
                <button
                    type="submit"
                    class="login-button"
                >
                    Create Profile
                </button>
            </form>
        </div>
    </section>
    <script>
        const profileForm =
            document.getElementById(
                "profileForm"
            );
        profileForm.addEventListener(
            "submit",
            function(event) {
                event.preventDefault();
                const user = {
                    name:
                        document.getElementById(
                            "name"
                        ).value,
                    email:
                        document.getElementById(
                            "email"
                        ).value,
                    phone:
                        document.getElementById(
                            "phone"
                        ).value
                };
                localStorage.setItem(
                    "user",
                    JSON.stringify(user)
                );
                alert(
                    "Profile created successfully!"
                );
                window.location.href =
                    "index.html";
            }
        );
    </script>
</body>
</html>

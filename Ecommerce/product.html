<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Product - ShopNow</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

</head>


<body>

    <nav class="navbar">

        <div class="logo">

            <a href="index.html">
                SHOP<span>NOW</span>
            </a>

        </div>


        <div class="nav-links">

            <a href="index.html">
                Home
            </a>

            <a href="index.html#products">
                Products
            </a>

        </div>


        <div class="nav-right">

            <a
                href="index.html"
                class="nav-icon"
            >
                <i class="fa-solid fa-house"></i>
            </a>

            <a
                href="login.html"
                class="nav-icon"
            >
                <i class="fa-regular fa-user"></i>
            </a>

        </div>

    </nav>


    <section class="product-details">

        <div class="product-detail-image">

            <img
                id="detailImage"
                src="images/product1.jpg"
                alt="Product"
            >
        </div>
        <div class="product-detail-info">
            <p id="detailBrand">
                Roadster
            </p>
            <h1 id="detailName">
                Classic Casual Shirt
            </h1>
            <div class="rating">
                <span>
                    4.5
                </span>
                <i class="fa-solid fa-star"></i>
                <span>
                    250 Reviews
                </span>
            </div>
            <h2 id="detailPrice">
                ₹799
            </h2>
            <p>
                Inclusive of all taxes.
            </p>
            <hr>
            <h3>
                Select Size
            </h3>
            <div class="sizes">
                <button>S</button>
                <button>M</button>
                <button>L</button>
                <button>XL</button>
                <button>XXL</button>
            </div>
            <button
                class="shop-button"
                onclick="addProductToCart()"
            >
                Add To Cart
            </button>
            <div class="delivery">
                <h3>
                    Delivery
                </h3>
                <p>
                    <i class="fa-solid fa-truck"></i>
                    Free delivery on orders above ₹999
                </p>
            </div>
        </div>
    </section>
    <script>
        function addProductToCart() {
            let cart =
                JSON.parse(
                    localStorage.getItem("cart")
                ) || [];
            const product = {
                id: 1,
                name: "Classic Casual Shirt",
                brand: "Roadster",
                price: 799,
                image: "images/product1.jpg",
                quantity: 1
            };
            const existing =
                cart.find(
                    item =>
                        item.id === product.id
                );
            if (existing) {
                existing.quantity++;
            } else {
                cart.push(product);
            }
            localStorage.setItem(
                "cart",
                JSON.stringify(cart)
            );
            alert(
                "Product added to cart!"
            );
        }
    </script>
</body>
</html>
